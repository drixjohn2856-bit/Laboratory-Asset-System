<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Lab Asset System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <p class="eyebrow">Laboratory operations</p>
      <h1>Lab Asset System</h1>
      <p class="muted">
        Sign in to manage equipment, borrowing, and maintenance.
      </p>
      <form id="login-form" class="stack-form">
        <label
          >Email<input
            name="email"
            type="email"
            placeholder="you@laboratory.org"
            required
        /></label>
        <label
          >Password<input
            name="password"
            type="password"
            placeholder="Enter your password"
            required
        /></label>
        <button class="button button-primary" type="submit">Sign in</button>
      </form>
      <p id="login-message" class="form-hint" role="status"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
